####################################
# 相机配置
camera_backend: 'orbbec'    # 'realsense' | 'orbbec'
camera:
  color_width: 640
  color_height: 480
  depth_width: 640
  depth_height: 480
  fps: 30

# 推理后端配置
inference_backend: 'onnx'     # 'pytorch' | 'onnx' | 'rknn'
onnx_model: 'best.onnx'
onnx_threads: 4               # ONNX Runtime CPU 线程数
rknn_model: 'weights/yolov5s.rknn'

####################################
# YoloV5模型权重路径
weight:  "weights/yolov5s.pt"
# 输入图像的尺寸
input_size: 640
# 类别个数
class_num:  2
# 标签名称
class_name: [ 'knob', 'indicator_light_on' ]
# 阈值设置
threshold:
  iou: 0.01
  confidence: 0.3
# 计算设备
# - cpu
# - 0 <- 使用GPU
device: 'cpu'
