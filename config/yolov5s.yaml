####################################
# 相机配置
camera_backend: 'orbbec'    # 'realsense' | 'orbbec'
camera:
  color_width: 640
  color_height: 480
  depth_width: 640
  depth_height: 480
  fps: 30

# 推理后端配置
inference_backend: 'onnx'     # 'pytorch' | 'onnx' | 'rknn'
onnx_model: 'best.onnx'
onnx_threads: 4               # ONNX Runtime CPU 线程数
rknn_model: 'weights/yolov5s.rknn'

####################################
# YoloV5模型权重路径
weight:  "newckpt/best.pt"
# 输入图像的尺寸
input_size: 640
# 类别个数
class_num:  6
# 标签名称
class_name: [ 'button', 'knob', 'bolt', 'nut', 'valve', 'pump' ]
# 阈值设置
threshold:
  iou: 0.01
  confidence: 0.3
# 计算设备
# - cpu
# - 0 <- 使用GPU
device: 'cpu'

####################################
# 旋钮角度估计
knob_angle:
  enable: true              # 是否启用角度估计
  binary_thresh: 180        # 二值化阈值（提取白色指针）
  circle_mask_ratio: 0.85   # 圆形 mask 比例（去除旋钮边框干扰）
  knob_class: 'knob'        # 旋钮类别名称（与 class_name 中一致）
